
name: Build FabSteel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build FabSteel APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FabSteel-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
